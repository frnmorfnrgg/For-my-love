<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Universo: Cartas Secretas</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa: #E0B0FF;
            --dourado: #D4AF37;
            --creme: #FFFDD0;
            --dark: #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Lora', serif; 
            background: url('https://images.unsplash.com/photo-1511739001486-6bfe10ce785f?q=80&w=1920') center/cover no-repeat fixed;
            min-height: 100vh;
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: -1; }

        /* NAVEGAÇÃO */
        nav { display: flex; justify-content: center; gap: 20px; padding: 20px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        nav button { 
            background: none; border: 2px solid white; color: white; padding: 10px 20px; 
            border-radius: 20px; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        nav button.active { background: var(--rosa); border-color: var(--rosa); }

        .container { max-width: 600px; margin: 40px auto; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

        /* FORMULÁRIO ESTILO INSTAGRAM */
        .insta-creator h2 { font-family: 'Dancing Script', cursive; text-align: center; font-size: 2rem; color: var(--rosa); margin-bottom: 20px; }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #666; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
        
        .preview-img { width: 100%; height: 200px; background: #eee; border-radius: 8px; margin-top: 10px; object-fit: cover; display: none; }

        .btn-generate { width: 100%; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* EXIBIÇÃO DA CARTA */
        .letter-display { display: none; animation: slideUp 0.8s ease; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .letter-paper { background: #fff; padding: 40px; position: relative; border-bottom: 30px solid white; }
        .letter-image { width: 100%; border-radius: 4px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .letter-text { line-height: 1.8; color: var(--dark); font-size: 1.1rem; white-space: pre-wrap; }
        .letter-sig { margin-top: 30px; font-family: 'Dancing Script', cursive; font-size: 2rem; text-align: right; color: var(--dourado); }

        .result-code { margin-top: 20px; background: #f4f4f4; padding: 15px; border-radius: 8px; word-break: break-all; font-size: 0.8rem; display: none; border: 1px dashed var(--rosa); }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <nav>
        <button id="nav-create" class="active" onclick="tab('create')">Criar Carta</button>
        <button id="nav-open" onclick="tab('open')">Abrir com Código</button>
    </nav>

    <div class="container">
        <section id="tab-create" class="card insta-creator">
            <h2>Criar Momento Especial</h2>
            <div class="field">
                <label>Título da Carta</label>
                <input type="text" id="title" placeholder="Ex: Para meu eterno amor">
            </div>
            <div class="field">
                <label>URL da Foto (Instagram ou Google Drive link direto)</label>
                <input type="text" id="photo-url" placeholder="Cole o link da imagem aqui..." oninput="updatePreview()">
                <img id="img-preview" class="preview-img">
            </div>
            <div class="field">
                <label>Sua Mensagem</label>
                <textarea id="message" rows="6" placeholder="Escreva aqui tudo o que você sente..."></textarea>
            </div>
            <button class="btn-generate" onclick="generateCode()">Gerar Código da Carta ✨</button>
            
            <div id="code-output" class="result-code">
                <p style="color:var(--dark); margin-bottom:5px"><strong>Copie e envie este código:</strong></p>
                <span id="final-code"></span>
            </div>
        </section>

        <section id="tab-open" class="card hidden">
            <h2 style="font-family:'Dancing Script'; text-align:center; margin-bottom:20px; font-size:2rem">Resgatar Carta</h2>
            <div class="field">
                <label>Cole o código secreto aqui:</label>
                <textarea id="input-code" rows="4" placeholder="Cole o código longo aqui..."></textarea>
            </div>
            <button class="btn-generate" onclick="openLetter()">Abrir Carta 💌</button>

            <div id="display-area" class="letter-display" style="margin-top:30px">
                <div class="letter-paper">
                    <img id="view-img" class="letter-image" src="" alt="Momento">
                    <h3 id="view-title" style="margin-bottom:15px; color:var(--dourado)"></h3>
                    <div id="view-msg" class="letter-text"></div>
                    <div class="letter-sig">Com amor, para sempre. ❤️</div>
                </div>
            </div>
        </section>
    </div>

    <script>
        // Trocar de abas
        function tab(name) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + name).classList.remove('hidden');
            document.getElementById('nav-' + name).classList.add('active');
        }

        // Preview da imagem em tempo real
        function updatePreview() {
            const url = document.getElementById('photo-url').value;
            const img = document.getElementById('img-preview');
            if(url) {
                img.src = url;
                img.style.display = 'block';
            }
        }

        // GERAR O CÓDIGO (Criptografia simples Base64)
        function generateCode() {
            const data = {
                t: document.getElementById('title').value,
                p: document.getElementById('photo-url').value,
                m: document.getElementById('message').value
            };

            if(!data.t || !data.m) return alert("Preencha o título e a mensagem!");

            const stringData = JSON.stringify(data);
            const encoded = btoa(unescape(encodeURIComponent(stringData))); // Converte para código
            
            document.getElementById('code-output').style.display = 'block';
            document.getElementById('final-code').innerText = encoded;
            alert("Código gerado com sucesso! Role para baixo e copie.");
        }

        // ABRIR A CARTA USANDO O CÓDIGO
        function openLetter() {
            const code = document.getElementById('input-code').value.trim();
            if(!code) return alert("Cole um código válido!");

            try {
                const decodedString = decodeURIComponent(escape(atob(code)));
                const data = JSON.parse(decodedString);

                // Preencher a carta
                document.getElementById('view-title').innerText = data.t;
                document.getElementById('view-msg').innerText = data.m;
                
                const img = document.getElementById('view-img');
                if(data.p) {
                    img.src = data.p;
                    img.style.display = 'block';
                } else {
                    img.style.display = 'none';
                }

                // Mostrar área da carta
                document.getElementById('display-area').style.display = 'block';
                window.scrollTo({ top: document.getElementById('display-area').offsetTop, behavior: 'smooth' });

            } catch(e) {
                alert("Código inválido! Verifique se copiou tudo corretamente.");
            }
        }
    </script>
</body>
</html>
