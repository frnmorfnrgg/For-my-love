<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Universo Particular</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --rosa: #E0B0FF; --dourado: #D4AF37; --dark: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Lora', serif; background: var(--dark); color: #333; overflow-x: hidden; }

        .main-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1511739001486-6bfe10ce785f?q=80&w=1920') center/cover;
            filter: brightness(0.4); z-index: -1;
        }

        nav { display: flex; justify-content: center; gap: 10px; padding: 15px; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); position: sticky; top: 0; z-index: 100; }
        nav button { background: none; border: 1px solid white; color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        nav button.active { background: var(--rosa); border-color: var(--rosa); }

        .container { max-width: 450px; margin: 20px auto; padding: 10px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        h2 { font-family: 'Dancing Script', cursive; color: var(--dourado); text-align: center; margin-bottom: 20px; font-size: 2rem; }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; color: #888; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-family: inherit; }

        .btn-main { width: 100%; background: var(--rosa); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* ESTILO DO CÓDIGO DE 6 DÍGITOS */
        .short-code-display { 
            display: none; text-align: center; margin-top: 20px; padding: 15px; 
            background: #fdf2ff; border: 2px dashed var(--rosa); border-radius: 12px;
        }
        .digit-box { font-size: 2.5rem; font-weight: bold; letter-spacing: 5px; color: var(--rosa); font-family: monospace; }

        /* CARTA FINAL */
        .letter-paper { background: white; padding: 30px; border-radius: 5px; margin-top: 20px; animation: fadeIn 1s; }
        .letter-img { width: 100%; border-radius: 4px; margin-bottom: 20px; }
        .letter-title { font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: var(--dourado); text-align: center; }
        .letter-text { line-height: 1.8; margin: 20px 0; white-space: pre-wrap; }
        .letter-sig { text-align: right; font-family: 'Dancing Script', cursive; font-size: 1.8rem; }

        .hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="main-bg"></div>
    <nav>
        <button id="nav-create" class="active" onclick="tab('create')">Criar</button>
        <button id="nav-open" onclick="tab('open')">Abrir (6 Dígitos)</button>
    </nav>

    <div class="container">
        <section id="tab-create" class="card">
            <h2>Nova Memória</h2>
            <div class="field">
                <label>Foto</label>
                <input type="file" id="file-input" accept="image/*" onchange="processImage()">
            </div>
            <div class="field"><input type="text" id="title" placeholder="Título"></div>
            <div class="field"><textarea id="message" rows="4" placeholder="Sua carta..."></textarea></div>
            <div class="field"><label>Data de Início</label><input type="date" id="start-date"></div>
            <div class="field"><input type="text" id="signature" placeholder="Sua Assinatura"></div>
            
            <button class="btn-main" onclick="saveLetter()">Gerar Código de 6 Dígitos ✨</button>

            <div id="short-code-area" class="short-code-display">
                <p>Seu código secreto é:</p>
                <div class="digit-box" id="generated-code">------</div>
                <p style="font-size: 0.7rem; margin-top: 10px; color: #666;">(Salvo neste navegador)</p>
            </div>
        </section>

        <section id="tab-open" class="card hidden">
            <h2>Digitar Código</h2>
            <div class="field">
                <input type="text" id="input-short-code" maxlength="6" style="text-align: center; font-size: 2rem; text-transform: uppercase;" placeholder="000000">
            </div>
            <button class="btn-main" onclick="loadLetter()">Ver Carta 💌</button>

            <div id="final-display" class="hidden">
                <div class="letter-paper">
                    <img id="view-img" class="letter-img">
                    <h1 id="view-title" class="letter-title"></h1>
                    <div id="view-msg" class="letter-text"></div>
                    <div id="view-sig" class="letter-sig"></div>
                </div>
            </div>
        </section>
    </div>

    <script>
        let optimizedImage = "";

        function tab(name) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + name).classList.remove('hidden');
            document.getElementById('nav-' + name).classList.add('active');
        }

        function processImage() {
            const file = document.getElementById('file-input').files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 400;
                    canvas.height = img.height * (400 / img.width);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    optimizedImage = canvas.toDataURL('image/jpeg', 0.5);
                }
            }
            reader.readAsDataURL(file);
        }

        function saveLetter() {
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            const data = {
                t: document.getElementById('title').value,
                m: document.getElementById('message').value,
                s: document.getElementById('signature').value,
                d: document.getElementById('start-date').value,
                i: optimizedImage
            };

            // Salva no banco de dados local do navegador
            localStorage.setItem('carta_' + code, JSON.stringify(data));

            document.getElementById('short-code-area').style.display = 'block';
            document.getElementById('generated-code').innerText = code;
            alert("Carta salva com sucesso!");
        }

        function loadLetter() {
            const code = document.getElementById('input-short-code').value.toUpperCase().trim();
            const rawData = localStorage.getItem('carta_' + code);

            if (!rawData) {
                return alert("Código não encontrado neste aparelho.");
            }

            const data = JSON.parse(rawData);
            document.getElementById('view-title').innerText = data.t;
            document.getElementById('view-msg').innerText = data.m;
            document.getElementById('view-sig').innerText = data.s;
            document.getElementById('view-img').src = data.i || "";
            
            document.getElementById('final-display').classList.remove('hidden');
        }
    </script>
</body>
</html>
