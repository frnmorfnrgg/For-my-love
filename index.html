<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Universo Particular: Editor Deluxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lora:ital,wght@0,400;1,400&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --rosa: #E0B0FF; --dourado: #D4AF37; --creme: #FFFDD0; --dark: #333; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Lora', serif; background: #1a1a1a; min-height: 100vh; color: var(--dark); }
        
        /* Fundo com imagem de Paris fixa */
        .main-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1511739001486-6bfe10ce785f?q=80&w=1920') center/cover;
            filter: brightness(0.5); z-index: -1;
        }

        nav { display: flex; justify-content: center; gap: 10px; padding: 15px; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); position: sticky; top: 0; z-index: 100; }
        nav button { background: none; border: 1px solid white; color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }
        nav button.active { background: var(--rosa); border-color: var(--rosa); }

        .container { max-width: 500px; margin: 20px auto; padding: 10px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* EDITOR */
        h2 { font-family: 'Dancing Script', cursive; color: var(--dourado); text-align: center; margin-bottom: 20px; font-size: 2rem; }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; color: #888; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 10px; font-family: inherit; }
        
        .emoji-bar { display: flex; gap: 5px; margin-top: 5px; overflow-x: auto; padding-bottom: 5px; }
        .emoji-btn { background: #f0f0f0; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }

        .file-input-wrapper { background: #f9f9f9; border: 2px dashed #ddd; padding: 20px; text-align: center; border-radius: 10px; cursor: pointer; }
        #img-preview { width: 100%; border-radius: 10px; margin-top: 10px; display: none; }

        .btn-main { width: 100%; background: var(--rosa); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 15px; transition: 0.3s; }
        .btn-main:hover { background: var(--dourado); }

        /* CARTA FINAL */
        .letter-paper { background: white; padding: 30px; border-radius: 5px; position: relative; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .letter-img { width: 100%; border-radius: 5px; margin-bottom: 20px; }
        .letter-title { font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: var(--dourado); margin-bottom: 15px; }
        .letter-text { font-size: 1.1rem; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; }
        
        .counter-box { background: var(--creme); padding: 15px; border-radius: 10px; text-align: center; margin: 20px 0; border: 1px solid var(--dourado); }
        .counter-box span { display: block; font-size: 1.2rem; font-weight: bold; }
        
        .letter-sig { text-align: right; font-family: 'Dancing Script', cursive; font-size: 1.8rem; margin-top: 30px; border-top: 1px solid #eee; padding-top: 10px; }

        .code-box { background: #333; color: #0f0; padding: 15px; border-radius: 10px; word-break: break-all; font-family: monospace; font-size: 0.7rem; margin-top: 15px; display: none; }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="main-bg"></div>

    <nav>
        <button id="nav-create" class="active" onclick="tab('create')">Criar</button>
        <button id="nav-open" onclick="tab('open')">Abrir</button>
    </nav>

    <div class="container">
        <section id="tab-create" class="card">
            <h2>Editor de Sonhos</h2>
            
            <div class="field">
                <label>Foto da Galeria</label>
                <div class="file-input-wrapper" onclick="document.getElementById('file-input').click()">
                    Clique para escolher uma foto 📸
                    <input type="file" id="file-input" class="hidden" accept="image/*" onchange="previewFile()">
                    <img id="img-preview">
                </div>
            </div>

            <div class="field">
                <label>Título Especial</label>
                <input type="text" id="title" placeholder="Ex: Nosso Eterno Amor">
            </div>

            <div class="field">
                <label>Sua Carta</label>
                <textarea id="message" rows="5" placeholder="Escreva aqui..."></textarea>
                <div class="emoji-bar">
                    <button class="emoji-btn" onclick="addEmoji('❤️')">❤️</button>
                    <button class="emoji-btn" onclick="addEmoji('✨')">✨</button>
                    <button class="emoji-btn" onclick="addEmoji('🌹')">🌹</button>
                    <button class="emoji-btn" onclick="addEmoji('💍')">💍</button>
                    <button class="emoji-btn" onclick="addEmoji('👩‍❤️‍👨')">👩‍❤️‍👨</button>
                </div>
            </div>

            <div class="field">
                <label>Data de Início (Para o Cronômetro)</label>
                <input type="date" id="start-date">
            </div>

            <div class="field">
                <label>Sua Assinatura</label>
                <input type="text" id="signature" placeholder="Seu nome...">
            </div>

            <button class="btn-main" onclick="generateDynamicCode()">Gerar Código Secreto 🔒</button>
            <div id="code-output" class="code-box"></div>
        </section>

        <section id="tab-open" class="card hidden">
            <h2>Resgatar Memória</h2>
            <div class="field">
                <label>Cole o código aqui:</label>
                <textarea id="input-code" rows="4"></textarea>
            </div>
            <button class="btn-main" onclick="openDynamicLetter()">Revelar Carta 💌</button>

            <div id="final-display" class="hidden" style="margin-top: 25px;">
                <div class="letter-paper">
                    <img id="view-img" class="letter-img">
                    <h1 id="view-title" class="letter-title"></h1>
                    <div id="view-counter" class="counter-box hidden"></div>
                    <div id="view-msg" class="letter-text"></div>
                    <div id="view-sig" class="letter-sig"></div>
                </div>
            </div>
        </section>
    </div>

    <script>
        let base64Image = "";

        function tab(name) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + name).classList.remove('hidden');
            document.getElementById('nav-' + name).classList.add('active');
        }

        function addEmoji(emoji) {
            document.getElementById('message').value += emoji;
        }

        function previewFile() {
            const file = document.getElementById('file-input').files[0];
            const reader = new FileReader();
            reader.onloadend = function() {
                base64Image = reader.result;
                const preview = document.getElementById('img-preview');
                preview.src = reader.result;
                preview.style.display = 'block';
            }
            if (file) reader.readAsDataURL(file);
        }

        function generateDynamicCode() {
            const data = {
                t: document.getElementById('title').value,
                m: document.getElementById('message').value,
                s: document.getElementById('signature').value,
                d: document.getElementById('start-date').value,
                i: base64Image // A imagem vai dentro do código!
            };

            if(!data.t || !data.m) return alert("Dê um título e escreva uma mensagem!");

            try {
                const json = JSON.stringify(data);
                const encoded = btoa(unescape(encodeURIComponent(json)));
                const output = document.getElementById('code-output');
                output.innerText = encoded;
                output.style.display = 'block';
                alert("Código gerado! Copie o bloco verde e envie.");
            } catch(e) {
                alert("A imagem pode ser muito grande. Tente uma foto menor ou com menos resolução.");
            }
        }

        function openDynamicLetter() {
            const code = document.getElementById('input-code').value.trim();
            try {
                const decoded = JSON.parse(decodeURIComponent(escape(atob(code))));
                
                document.getElementById('view-title').innerText = decoded.t;
                document.getElementById('view-msg').innerText = decoded.m;
                document.getElementById('view-sig').innerText = decoded.s;
                
                if(decoded.i) {
                    document.getElementById('view-img').src = decoded.i;
                    document.getElementById('view-img').classList.remove('hidden');
                }

                if(decoded.d) {
                    const start = new Date(decoded.d);
                    const now = new Date();
                    const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
                    const counter = document.getElementById('view-counter');
                    counter.innerHTML = `<span>Estamos juntos há</span><strong>${diff} dias</strong>`;
                    counter.classList.remove('hidden');
                }

                document.getElementById('final-display').classList.remove('hidden');
                window.scrollTo({ top: document.getElementById('final-display').offsetTop, behavior: 'smooth' });
            } catch(e) {
                alert("Código inválido ou expirado.");
            }
        }
    </script>
</body>
</html>
